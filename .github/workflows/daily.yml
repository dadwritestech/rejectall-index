# Daily RejectAll Index run. Written but NOT enabled: every job is skipped
# unless the repository variable REJECTALL_ENABLED is set to "true".
#
# Vantage point matters: banners differ by country, and GitHub-hosted runners
# are mostly in the US. This workflow therefore targets a self-hosted runner
# labelled "germany"; set REJECTALL_VANTAGE_* to describe wherever it runs.
# The LLM button-locator is off unless that runner has a llama-server and a
# LLAMA_API_KEY secret.
name: daily-index

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC, off the hour to spread load
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-index
  cancel-in-progress: false

jobs:
  measure:
    if: vars.REJECTALL_ENABLED == 'true'
    runs-on: [self-hosted, germany]
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      REJECTALL_VANTAGE_COUNTRY: ${{ vars.REJECTALL_VANTAGE_COUNTRY || 'DE' }}
      REJECTALL_VANTAGE_DESCRIPTION: ${{ vars.REJECTALL_VANTAGE_DESCRIPTION || 'Self-hosted runner in Germany' }}
      LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Tests (fixture banners)
        run: python -m pytest -q tests
      - name: Measure
        run: python -m rejectall run ${{ secrets.LLAMA_API_KEY == '' && '--no-llm' || '' }}
      - name: Build leaderboard + badges
        run: python -m rejectall build
      - name: Commit results
        run: |
          git config user.name "rejectall-bot"
          git config user.email "rejectall-bot@users.noreply.github.com"
          git add data site
          git commit -m "Daily run $(date -u +%F)" || echo "nothing to commit"
          git push
