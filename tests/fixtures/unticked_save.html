<!doctype html><html><head><meta charset="utf-8"><title>Unticked</title><style>.bn{position:fixed;bottom:0;left:0;width:400px;background:#eee;padding:20px;z-index:99;transition:transform .2s}</style></head><body><h1>Browser</h1>
<div class="bn" id="cookies"><b>Cookies</b>
<label>Notwendige Cookies <input type="checkbox" checked disabled></label>
<label>Marketing-Cookies <input type="checkbox" id="m"></label><label>Analyse-Cookies <input type="checkbox" id="a"></label>
<button onclick="done()">Auswahl akzeptieren</button><button onclick="done()">Alle akzeptieren</button></div>
<script>function done(){document.getElementById('cookies').remove()}</script></body></html>
